name: Check RPE repository-wide consistency

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.py"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - "**/*.html"
      - "**/*.js"
      - "**/*.lean"
      - "scripts/check_repository_crossfile_consistency.py"
      - ".github/workflows/check-repository-crossfile.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.py"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - "**/*.html"
      - "**/*.js"
      - "**/*.lean"
      - "scripts/check_repository_crossfile_consistency.py"
      - ".github/workflows/check-repository-crossfile.yml"

permissions:
  contents: read

jobs:
  scan:
    name: Tracked files and cross-document contract audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan every tracked repository file
        run: python scripts/check_repository_crossfile_consistency.py
