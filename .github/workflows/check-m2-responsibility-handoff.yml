name: Check M2 responsibility handoff

on:
  pull_request:
    paths:
      - "rpe_kernel/pipeline.py"
      - "rpe_kernel/contract_versions.py"
      - "schemas/external-kernel/contract-versions.json"
      - "schemas/external-kernel/governed-evaluation-result.schema.json"
      - "scripts/check_m2_responsibility_handoff.py"
      - ".github/workflows/check-m2-responsibility-handoff.yml"
  push:
    branches: [main]
    paths:
      - "rpe_kernel/pipeline.py"
      - "rpe_kernel/contract_versions.py"
      - "schemas/external-kernel/contract-versions.json"
      - "schemas/external-kernel/governed-evaluation-result.schema.json"
      - "scripts/check_m2_responsibility_handoff.py"
      - ".github/workflows/check-m2-responsibility-handoff.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python scripts/check_m2_responsibility_handoff.py
