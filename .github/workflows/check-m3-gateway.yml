name: Check M3 responsibility gateway

on:
  push:
    branches:
      - "akihisaono0118/dan-65-rpe-m3-adaptive-responsibility-gateway-architecture-reform"
    paths:
      - "rpe_kernel/gateway.py"
      - "scripts/check_m3_gateway.py"
      - "docs/m3-classification-and-first-slice.md"
      - ".github/workflows/check-m3-gateway.yml"
  pull_request:
    paths:
      - "rpe_kernel/gateway.py"
      - "scripts/check_m3_gateway.py"
      - "docs/m3-classification-and-first-slice.md"
      - ".github/workflows/check-m3-gateway.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install .
      - name: Check M3 gateway
        run: python scripts/check_m3_gateway.py
