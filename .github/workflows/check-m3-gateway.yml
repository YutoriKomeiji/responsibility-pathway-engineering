name: Check M3 responsibility gateway

on:
  push:
    branches:
      - "akihisaono0118/dan-65-rpe-m3-adaptive-responsibility-gateway-architecture-reform"
    paths:
      - "rpe_kernel/__init__.py"
      - "rpe_kernel/gateway.py"
      - "rpe_kernel/guarded_gateway.py"
      - "rpe_kernel/risk_conditions.py"
      - "rpe_kernel/integrity.py"
      - "rpe_kernel/human_return.py"
      - "rpe_kernel/http_api.py"
      - "rpe_kernel/rpe-kernel.openapi.json"
      - "spec/openapi/rpe-kernel.openapi.json"
      - "schemas/m3/**"
      - "scripts/check_m3_gateway.py"
      - "scripts/check_m3_contract_schemas.py"
      - "scripts/check_m3_openapi_runtime_schema.py"
      - "scripts/check_m3_integrity.py"
      - "scripts/check_m3_human_return.py"
      - "scripts/check_m3_guarded_gateway.py"
      - "scripts/check_rest_api.py"
      - "scripts/check_openapi_contract.py"
      - "scripts/benchmark_m3_gateway.py"
      - "docs/m3-classification-and-first-slice.md"
      - "docs/m3-adoption-profiles.md"
      - ".github/workflows/check-m3-gateway.yml"
  pull_request:
    paths:
      - "rpe_kernel/__init__.py"
      - "rpe_kernel/gateway.py"
      - "rpe_kernel/guarded_gateway.py"
      - "rpe_kernel/risk_conditions.py"
      - "rpe_kernel/integrity.py"
      - "rpe_kernel/human_return.py"
      - "rpe_kernel/http_api.py"
      - "rpe_kernel/rpe-kernel.openapi.json"
      - "spec/openapi/rpe-kernel.openapi.json"
      - "schemas/m3/**"
      - "scripts/check_m3_gateway.py"
      - "scripts/check_m3_contract_schemas.py"
      - "scripts/check_m3_openapi_runtime_schema.py"
      - "scripts/check_m3_integrity.py"
      - "scripts/check_m3_human_return.py"
      - "scripts/check_m3_guarded_gateway.py"
      - "scripts/check_rest_api.py"
      - "scripts/check_openapi_contract.py"
      - "scripts/benchmark_m3_gateway.py"
      - "docs/m3-classification-and-first-slice.md"
      - "docs/m3-adoption-profiles.md"
      - ".github/workflows/check-m3-gateway.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package and validation dependency
        run: python -m pip install . jsonschema
      - name: Check M3 gateway
        run: python scripts/check_m3_gateway.py
      - name: Check M3 contract schemas
        run: python scripts/check_m3_contract_schemas.py
      - name: Check M3 runtime output against OpenAPI
        run: python scripts/check_m3_openapi_runtime_schema.py
      - name: Check M3 configuration and relationship integrity
        run: python scripts/check_m3_integrity.py
      - name: Check M3 Human Return readiness
        run: python scripts/check_m3_human_return.py
      - name: Check M3 combined responsibility guards
        run: python scripts/check_m3_guarded_gateway.py
      - name: Check REST integration
        run: python scripts/check_rest_api.py
      - name: Check OpenAPI parity and boundaries
        run: python scripts/check_openapi_contract.py
      - name: Benchmark smoke without latency threshold
        run: python scripts/benchmark_m3_gateway.py --iterations 25 --warmup 5
