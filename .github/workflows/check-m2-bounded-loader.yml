name: Check M2 bounded loader

on:
  pull_request:
    paths:
      - "rpe_kernel/loader.py"
      - "rpe_kernel/__init__.py"
      - "scripts/check_m2_bounded_loader.py"
      - "examples/external-kernel/minimal-governed-evaluation-request.json"
      - ".github/workflows/check-m2-bounded-loader.yml"
  push:
    branches: [main]
    paths:
      - "rpe_kernel/loader.py"
      - "rpe_kernel/__init__.py"
      - "scripts/check_m2_bounded_loader.py"
      - "examples/external-kernel/minimal-governed-evaluation-request.json"
      - ".github/workflows/check-m2-bounded-loader.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python scripts/check_m2_bounded_loader.py
