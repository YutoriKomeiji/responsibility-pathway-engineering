name: Check RPE value demo

on:
  pull_request:
    paths:
      - "scripts/value_demo.py"
      - "docs/why-rpe.md"
      - "examples/external-kernel/minimal-governed-evaluation-request.json"
      - "rpe_kernel/**"
      - ".github/workflows/check-rpe-value-demo.yml"
  push:
    branches: [main]
    paths:
      - "scripts/value_demo.py"
      - "docs/why-rpe.md"
      - "examples/external-kernel/minimal-governed-evaluation-request.json"
      - "rpe_kernel/**"
      - ".github/workflows/check-rpe-value-demo.yml"

permissions:
  contents: read

jobs:
  value-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python scripts/value_demo.py
      - name: Check machine-readable value demo
        run: |
          python scripts/value_demo.py --json > /tmp/rpe-value-demo.json
          python -c 'import json; r=json.load(open("/tmp/rpe-value-demo.json")); assert r["with_rpe"]["decision"] == "human_gate"; assert r["with_rpe"]["authority_effect"] == "none"; assert r["approved_with_rpe"]["decision"] == "allow"; assert r["approved_with_rpe"]["authority_effect"] == "none"; assert r["approved_with_rpe"]["executed"] is False; assert r["external_action_executed"] is False; assert r["without_rpe"]["decision"] == "continue"'
