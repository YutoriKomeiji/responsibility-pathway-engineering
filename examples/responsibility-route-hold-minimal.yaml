id: responsibility_route_hold_example_001
version: 0.1.0
lifecycle_state: originating

nodes:
  - id: operation_owner_001
    type: Human
    capabilities:
      - review
      - decide
      - stop
      - resume
      - escalate
    authority_scope:
      can_decide: true
      can_approve: true
      can_execute: false
      can_stop: true
      can_repair: true
      can_close: false
    evidence_binding:
      required: true
      log_reference: evidence_log_001
      retention_scope: example_only
      access_boundary: local_review
    human_responsibility_capacity: true

  - id: ai_executor_001
    type: AIAgent
    capabilities:
      - dispatch
      - preserve
      - request_reconciliation
    authority_scope:
      can_decide: false
      can_approve: false
      can_execute: true
      can_stop: false
      can_repair: false
      can_close: false
    evidence_binding:
      required: true
      log_reference: evidence_log_001
      retention_scope: example_only
      access_boundary: local_review
    human_responsibility_capacity: false
    ai_participation:
      may_generate: true
      may_recommend: true
      may_execute_under_authority: true
      assumes_final_responsibility: false

  - id: reconciliation_process_001
    type: BusinessProcess
    capabilities:
      - receive
      - readback
      - reconcile
      - preserve
    authority_scope:
      can_decide: false
      can_approve: false
      can_execute: false
      can_stop: false
      can_repair: false
      can_close: false
    evidence_binding:
      required: true
      log_reference: evidence_log_001
      retention_scope: example_only
      access_boundary: local_review
    human_responsibility_capacity: false

edges:
  - from: ai_executor_001
    to: reconciliation_process_001
    relation_type: route_for_reconciliation
    condition: consequential_effect_status_unknown
    evidence_reference: evidence_log_001

  - from: reconciliation_process_001
    to: operation_owner_001
    relation_type: bounded_human_return_if_authority_required
    condition: reconciliation_cannot_resolve_next_authorized_action
    evidence_reference: evidence_log_001

roles:
  decision_owner: operation_owner_001
  approval_gate: operation_owner_001
  execution_actor: ai_executor_001
  stop_authority: operation_owner_001
  evidence_log: evidence_log_001
  repair_owner: operation_owner_001
  return_point: route_reconciliation_hold_001
  human_return_point: return_point_human_fallback_001
  affected_party: null

action_class:
  id: class_d_consequential_external_action
  name: Reversible External Action
  level: 3
  description: Consequential external action whose transport result may be ambiguous and requires reconciliation before redispatch.
  responsibility_requirements:
    decision_owner_required: true
    approval_gate_required: true
    stop_authority_required: true
    evidence_log_required: true
    return_point_required: true
    repair_owner_required: true
    affected_party_visibility_required: false
  reversibility: context_dependent
  external_impact: external
  automation_boundary:
    may_be_automated: true
    requires_human_review: false
    requires_human_authorization: true
    prohibited_without_explicit_authority: true

evidence_logs:
  - id: evidence_log_001
    pathway_id: responsibility_route_hold_example_001
    evidence_categories:
      - dispatch_attempt
      - transport_result
      - external_readback
      - authority_state
      - route_selection
      - receiver_eligibility
      - unresolved_payload
    integrity_state: partial
    ordering: timestamped
    reconstruction_support:
      can_reconstruct_action: true
      can_reconstruct_authority: true
      can_reconstruct_context: true
      can_reconstruct_uncertainty: true
      can_reconstruct_stop_point: true
      can_reconstruct_return_point: true
      can_reconstruct_repair_action: false
      can_reconstruct_route_selection: true
    quality:
      completeness: partial
      readability: human_readable
      availability: local_example
      scope_clarity: example_only
      retention_period: not_specified
      privacy_constraints: avoid_sensitive_data
      safety_constraints: no_production_use
    access_boundary:
      readable_by:
        - operation_owner_001
        - reconciliation_process_001
      writable_by:
        - operation_owner_001
        - reconciliation_process_001
      redaction_required: false
      retention_owner: operation_owner_001
      repair_owner_access: true

return_points:
  - id: route_reconciliation_hold_001
    type: ProcessReturnPoint
    source_node: ai_executor_001
    target_node: reconciliation_process_001
    route_kind: HoldForReconciliation
    authority_effect: none
    receiver_eligibility:
      receiver_identified: true
      authority_scope_explicit: true
      delegation_scope_explicit: true
      unresolved_payload_supported: true
      evidence_access_sufficient: true
      time_window_sufficient: true
      intervention_capacity_sufficient: true
      eligibility_basis: "Authorized reconciliation process may inspect effect state but may not infer execution or resume Authority."
    unresolved_payload:
      decision_required: "Determine whether the consequential external effect occurred before any redispatch."
      effect_status: unknown
      evidence_refs:
        - evidence_log_001
      prohibited_assumptions:
        - "transport failure means external failure"
        - "successful readback grants resume authority"
        - "technical capability grants authority"
      residual_owner: operation_owner_001
      allowed_next_actions:
        - reconcile
        - hold
        - escalate
      reevaluation_condition: "Independent readback resolves effect status or an authorized owner changes the route."
    returnability_conditions:
      meaning_visible: true
      authority_visible: true
      time_available: true
      information_quality_sufficient: false
      trust_calibrated: true
      reversibility_or_compensation_visible: true
      value_visible: true
      cost_visible: true
    supported_actions:
      - hold
      - reconcile
      - escalate
    evidence_requirements:
      evidence_log_required: true
      minimum_evidence_categories:
        - dispatch_attempt
        - external_readback
      reconstruction_required: true
      access_boundary: local_review
      provenance_required: true

  - id: return_point_human_fallback_001
    type: HumanReturnPoint
    source_node: reconciliation_process_001
    target_node: operation_owner_001
    route_kind: HumanReturn
    authority_effect: none
    receiver_eligibility:
      receiver_identified: true
      authority_scope_explicit: true
      delegation_scope_explicit: true
      unresolved_payload_supported: true
      evidence_access_sufficient: true
      time_window_sufficient: true
      intervention_capacity_sufficient: true
      eligibility_basis: "Human owner is eligible only when an unresolved decision requires human-held Authority."
    returnability_conditions:
      meaning_visible: true
      authority_visible: true
      time_available: true
      information_quality_sufficient: partial
      trust_calibrated: true
      reversibility_or_compensation_visible: true
      value_visible: true
      cost_visible: true
    supported_actions:
      - explain
      - hold
      - repair
      - continue
      - close
    evidence_requirements:
      evidence_log_required: true
      minimum_evidence_categories:
        - authority_state
        - external_readback
        - unresolved_payload
      reconstruction_required: true
      access_boundary: local_review
      provenance_required: true
    human_conditions:
      understandable_information: true
      meaningful_choice: true
      refusal_available: true
      stop_authority_available: true
      repair_path_available: true
      adequate_review_time: true
      no_coercive_pressure: true

repairs: []

responsibility_boundary:
  human_author_required: true
  ai_final_responsibility_allowed: false
  institutional_authority_required_when_applicable: false
  legal_or_moral_claims_out_of_scope: true
  fail_closed_does_not_imply_human_gate: true
  evidence_transfer_does_not_create_authority: true
  receiver_capability_does_not_prove_eligibility: true
  recovery_does_not_grant_resume_authority: true

formalization_scope:
  assumptions:
    - The example models an unresolved post-dispatch effect that is routed to reconciliation rather than immediately to a human.
    - A bounded Human Return remains available only when human-held Authority is actually required.
    - The reconciliation process can resolve effect state but cannot grant execution or resume Authority.
  modeled_entities:
    - operation_owner_001
    - ai_executor_001
    - reconciliation_process_001
    - evidence_log_001
    - route_reconciliation_hold_001
    - return_point_human_fallback_001
  excluded_claims:
    - legal_liability
    - moral_blame
    - compliance
    - production_safety
    - fairness
    - certification
    - universal_framework_compatibility
    - exactly_once_execution
    - real_world_accountability_resolution
  theorem_status: not_formalized
